[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "plm-intelligence"
version = "0.1.0"
description = "Turn an OEM 3DEXPERIENCE XML extract into traceable engineering decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
agent = ["openai>=1.40", "python-dotenv>=1.0"]
app = ["plm-intelligence[agent]", "streamlit>=1.66", "pandas>=2.0", "plotly>=5.20"]

[tool.hatch.build.targets.wheel]
packages = ["src/plm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = [".", "src", "app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
